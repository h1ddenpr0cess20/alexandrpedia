name: Test Alexandrpedia

on:
  pull_request:
  push:
    branches:
      - main
      - feature/four-wall-library-layout

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # The engine (madness-engine) is an npm dependency; the page-block test builds real engine books.
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/readers.js
          node --check src/walk-paths.js
          node --check src/room-plan.js
          node --check src/page-block.js
          node --check src/sections.js
          node --check scripts/check-titles.mjs
          node --check scripts/snapshot-wikipedia.mjs
          node --check scripts/snapshot-grokipedia.mjs
          node --check src/article-update.js
          node --check scripts/update-articles.mjs
          node --check test/article-update.test.js
      - name: Verify article updater CLI loads
        run: npm run update-articles -- --help
      - name: Run tests
        run: npm test
